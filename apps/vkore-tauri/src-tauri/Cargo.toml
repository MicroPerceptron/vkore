[package]
name = "vkore-tauri"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "An experimental Tauri desktop for vKore: the same engine behind a web front end."

# Its own workspace, like `tools/servo-browser`: the desktop pulls in a webview
# stack that the CLI, the iced desktop and CI never build, and the two resolve
# independently. The engine reaches it only through the path dependencies.
[workspace]

[lib]
name = "vkore_tauri_lib"

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vkore-agent = { path = "../../../crates/vkore-agent" }
vkored = { path = "../../../crates/vkored" }
vkore-vm = { path = "../../../crates/vkore-vm" }
vkore-volume = { path = "../../../crates/vkore-volume" }
# MIT/Apache, already in the tree through Tauri; encodes a previewed image for the page.
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
