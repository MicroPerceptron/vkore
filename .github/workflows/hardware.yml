name: Hardware backend
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.github/workflows/hardware.yml'
      - 'tools/check-hardware-backend.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev libudev-dev qemu-system-x86
      - name: Install pinned Rust
        run: rustup toolchain install nightly-2026-07-13 --profile minimal --component clippy --component rustfmt
      - name: Authentication policy tests
        run: python3 -m unittest discover -s tools/tests -p 'test_linux_policy.py'
      - name: Formatting
        run: cargo fmt --all -- --check
      # The public runner cannot fetch the desktop's private Axiom pin.
      # Exercise the actual backend sources in an isolated workspace; full
      # workspace and desktop rendering remain separate local gates.
      - name: Backend Clippy
        run: python3 tools/check-hardware-backend.py clippy
      - name: Backend tests, including native affinity
        env:
          VKORE_TEST_MEMORY_QEMU: ${{ runner.os == 'Linux' && '/usr/bin/qemu-system-x86_64' || '' }}
        run: python3 tools/check-hardware-backend.py test
