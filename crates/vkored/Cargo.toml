[package]
name = "vkored"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "vKore's runtime: Kore machines and their volumes on a Linux or macOS host, and the `vkore` command."

[dependencies]
serde.workspace = true
serde_json.workspace = true
vkore-vm = { path = "../vkore-vm" }

[target.'cfg(unix)'.dependencies]
vkore-volume = { path = "../vkore-volume" }
clap = { version = "4.6.7", features = ["derive"] }
# Ctrl-C asks the guest to stop rather than killing QEMU under it.
ctrlc = "3.5.2"

[dev-dependencies]
tempfile = "3.23.0"

[lib]
name = "vkored"
path = "src/lib.rs"

[[bin]]
name = "vkore"
path = "src/bin/vkore.rs"

[lints]
workspace = true
