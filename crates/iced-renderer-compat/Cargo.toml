[package]
name = "iced_renderer"
version = "0.15.0-dev"
edition = "2024"
publish = false
license = "MIT"
description = "Type-only Iced widget compatibility for caller-owned renderers."

[features]
default = []
canvas = ["geometry"]
geometry = ["iced_graphics/geometry"]
image = ["iced_graphics/image"]
svg = ["iced_graphics/svg"]
svg-text = ["svg"]
svg-raster-images = ["svg"]
web-colors = ["iced_graphics/web-colors"]
wgpu = []
wgpu-bare = []
tiny-skia = []
x11 = []
wayland = []

[dependencies]
axui-iced = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "5460bab4fbf16b11535ac09eb57f60bc1cb6ea3b" }
iced_core = { git = "https://github.com/MicroPerceptron/iced", rev = "1021994b8a155e8285ca5ea18239467616387fbd", default-features = false }
iced_graphics = { git = "https://github.com/MicroPerceptron/iced", rev = "1021994b8a155e8285ca5ea18239467616387fbd", default-features = false }
