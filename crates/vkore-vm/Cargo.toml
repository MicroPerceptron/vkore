[package]
name = "vkore-vm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Kore machines under QEMU: the production topology, host probes, boot media, QMP and boot readiness."

[lib]
name = "vkore_vm"
path = "src/lib.rs"

[dependencies]
