[package]
name = "vkore-ui"
version = "0.0.0"
edition = "2024"
publish = false
license = "MPL-2.0"
description = "Native Axiom-rendered desktop control plane for vKore."

[dependencies]
axcomp = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "e9cdd8affe6eb02d4c058837c5aeb3f711abd60f" }
axgfx = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "e9cdd8affe6eb02d4c058837c5aeb3f711abd60f" }
axui-core = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "e9cdd8affe6eb02d4c058837c5aeb3f711abd60f" }
axui-fonts = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "e9cdd8affe6eb02d4c058837c5aeb3f711abd60f" }
axui-iced = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "e9cdd8affe6eb02d4c058837c5aeb3f711abd60f" }
axui-raster = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "e9cdd8affe6eb02d4c058837c5aeb3f711abd60f" }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
cosmic-text = "0.19"
iced_core = { git = "https://github.com/MicroPerceptron/iced", rev = "3de451447bd28217bb535632867550908e29d5d0", default-features = false }
iced_graphics = { git = "https://github.com/MicroPerceptron/iced", rev = "3de451447bd28217bb535632867550908e29d5d0", default-features = false, features = ["geometry"] }
iced_runtime = { git = "https://github.com/MicroPerceptron/iced", rev = "3de451447bd28217bb535632867550908e29d5d0", default-features = false }
iced_widget = { git = "https://github.com/MicroPerceptron/iced", rev = "3de451447bd28217bb535632867550908e29d5d0", default-features = false }
iced_winit = { git = "https://github.com/MicroPerceptron/iced", rev = "3de451447bd28217bb535632867550908e29d5d0", default-features = false, features = ["x11", "wayland"] }
serde_json.workspace = true
softbuffer = "0.4.8"

[dev-dependencies]
hostlinkd = { package = "vkored", path = "../vkored" }
tempfile = "3.27"

[[bin]]
name = "vkore-ui"
path = "src/main.rs"
