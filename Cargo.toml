[workspace]
members = [
    "crates/vkore-addon-sdk",
    "crates/vkore-git-addon",
    "crates/vkore-gmail-addon",
    "crates/vkore-reference-addon",
    "crates/vkore-policy",
    "crates/vkore-packages",
    "crates/vkored",
    "crates/vkore-hostlink-ab",
    "crates/iced-renderer-compat",
    "crates/vkore-ui",
    "crates/vkore-vm",
    "crates/vkore-workspace",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/MicroPerceptron/vkore"
rust-version = "1.97"

# Shared contracts remain Kore-owned. During the current-Kore port, use
# scripts/local-kore.py to override the complete direct dependency set. The
# historical wire pins below are not the final integrated guest revision.
[workspace.dependencies]
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }
kore-driver = { git = "https://github.com/MicroPerceptron/kore.git", rev = "c3baa37be40de2214de2f36c2a690d76788ed980" }
kore-hostlink = { git = "https://github.com/MicroPerceptron/kore.git", rev = "c3baa37be40de2214de2f36c2a690d76788ed980" }
kore-hostlink-shmem = { git = "https://github.com/MicroPerceptron/kore.git", rev = "c3baa37be40de2214de2f36c2a690d76788ed980" }
kore-svc-dagfs = { git = "https://github.com/MicroPerceptron/kore.git", rev = "c3baa37be40de2214de2f36c2a690d76788ed980" }
kore-workspace-sync = { git = "https://github.com/MicroPerceptron/kore.git", rev = "c3baa37be40de2214de2f36c2a690d76788ed980" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `iced_widget` reexports `iced_renderer::{core, graphics}` even when every
# widget is generic over a caller renderer. Use an explicit type-only bridge so
# native Axiom clients do not link Tiny-Skia or WGPU merely to satisfy that
# package-level reexport.
[patch."https://github.com/MicroPerceptron/iced"]
iced_renderer = { path = "crates/iced-renderer-compat" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# The native client software-rasterizes directly into the presentation buffer.
# Keep that hot path optimized even for `cargo run` development launches.
[profile.dev.package.vkore-ui]
opt-level = 2
