[package]
name = "vkore-vm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Kore machines under QEMU: the production topology, host probes, boot media, QMP and boot readiness."

[lib]
name = "vkore_vm"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Generated QAPI vocabulary only; keep our bounded, id-correlated transport.
qapi-qmp = "=0.15.0"
qapi-spec = "=0.3.2"
rustix = { version = "1.1.4", features = ["event", "thread", "process", "fs"] }
# Kore publishes boot media digests as SHA-256 (release SHA256SUMS).
sha2 = "0.10.9"
# MIT; query CPU/memory/disks only, no process inventory or background sampling.
sysinfo = { version = "=0.37.2", default-features = false, features = ["system", "disk"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
