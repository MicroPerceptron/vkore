[package]
name = "vkore-ui"
version = "0.0.0"
edition = "2024"
publish = false
license = "MPL-2.0"
description = "Native Axiom-rendered desktop control plane for vKore."

[dependencies]
axcomp = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "5460bab4fbf16b11535ac09eb57f60bc1cb6ea3b" }
axgfx = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "5460bab4fbf16b11535ac09eb57f60bc1cb6ea3b" }
axui-core = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "5460bab4fbf16b11535ac09eb57f60bc1cb6ea3b" }
axui-fonts = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "5460bab4fbf16b11535ac09eb57f60bc1cb6ea3b" }
axui-iced = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "5460bab4fbf16b11535ac09eb57f60bc1cb6ea3b" }
axui-raster = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "5460bab4fbf16b11535ac09eb57f60bc1cb6ea3b" }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
cosmic-text = "0.19"
harper-core = "=0.40.0"
# Parses the mark's SVG path data; already reached through the geometry lane.
zeno = "0.3.3"
iced_core = { git = "https://github.com/MicroPerceptron/iced", rev = "1021994b8a155e8285ca5ea18239467616387fbd", default-features = false, features = ["crisp"] }
iced_graphics = { git = "https://github.com/MicroPerceptron/iced", rev = "1021994b8a155e8285ca5ea18239467616387fbd", default-features = false, features = ["geometry"] }
iced_runtime = { git = "https://github.com/MicroPerceptron/iced", rev = "1021994b8a155e8285ca5ea18239467616387fbd", default-features = false }
iced_widget = { git = "https://github.com/MicroPerceptron/iced", rev = "1021994b8a155e8285ca5ea18239467616387fbd", default-features = false, features = ["canvas"] }
iced_winit = { git = "https://github.com/MicroPerceptron/iced", rev = "1021994b8a155e8285ca5ea18239467616387fbd", default-features = false, features = ["x11", "wayland"] }
serde_json.workspace = true
softbuffer = "0.4.8"

[dev-dependencies]
hostlinkd = { package = "vkored", path = "../vkored" }
tempfile = "3.27"

[[bin]]
name = "vkore-ui"
path = "src/main.rs"
