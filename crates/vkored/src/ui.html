<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kore Authority Lab</title>
<style>
:root{color-scheme:dark;--bg:#0a0d12;--panel:#111722;--line:#253044;--muted:#8d9bb0;--text:#ecf2ff;--cyan:#62d8ff;--green:#68e0a0;--amber:#f4c76b;--red:#ff7c86;--violet:#bca8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#172239 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:#0a0d12dd;position:sticky;top:0;z-index:2;backdrop-filter:blur(16px)}h1{font-size:17px;letter-spacing:.02em;margin:0}.live{display:flex;align-items:center;gap:8px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}main{max-width:1440px;margin:auto;padding:22px}.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:14px}.tab{border:1px solid var(--line);background:#0f1520;color:var(--muted);padding:9px 13px;border-radius:9px;white-space:nowrap;cursor:pointer}.tab.active{color:var(--text);border-color:#4e6388;background:#172239}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.metric,.card{border:1px solid var(--line);background:linear-gradient(180deg,#121925,#0e141e);border-radius:12px}.metric{padding:13px}.metric b{font-size:22px;display:block}.metric span{color:var(--muted);font-size:12px}.view{display:none}.view.active{display:block}.stream{display:flex;flex-direction:column;gap:10px}.card{padding:14px 16px}.meta{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:8px}.pill{border:1px solid var(--line);border-radius:99px;padding:2px 7px;text-transform:uppercase;letter-spacing:.07em;font-size:10px}.broker{color:var(--violet)}.agent{color:var(--cyan)}.ok{color:var(--green)}.bad{color:var(--red)}pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d9e3f4}.message{font-size:15px}.tool{border-left:3px solid var(--amber)}.answer{border-left:3px solid var(--cyan)}.authority{border-left:3px solid var(--green)}.revoked{border-left-color:var(--red);opacity:.72}.empty{text-align:center;color:var(--muted);padding:72px 20px;border:1px dashed var(--line);border-radius:12px}.dag{display:flex;flex-direction:column;gap:12px}.node{border:1px solid var(--line);padding:12px;border-radius:10px;background:#0c121b}.edge{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;color:var(--muted);padding:12px 0 0 22px;border-left:1px solid #3b4a62;margin-left:12px}.agent-node{border-left:3px solid var(--violet)}@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}main{padding:14px}}@media(max-width:520px){.summary{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>Kore Authority Lab</h1><div style="color:var(--muted);font-size:12px">live bounded observer · no authority in this UI</div></div><div class="live"><span class="dot"></span><span id="status">connecting</span></div></header>
<main>
<div class="tabs" id="tabs">
<button class="tab active" data-view="conversation">Conversation</button><button class="tab" data-view="raw">Raw AI output</button><button class="tab" data-view="validation">Validation</button><button class="tab" data-view="broker">Broker activity</button><button class="tab" data-view="authority">Capability state</button><button class="tab" data-view="prompts">System/model prompts</button>
</div>
<div class="summary"><div class="metric"><b id="eventCount">0</b><span>bounded events</span></div><div class="metric"><b id="agentCount">0</b><span>agent turns</span></div><div class="metric"><b id="grantCount">0</b><span>installed grants</span></div><div class="metric"><b id="refusalCount">0</b><span>refusals</span></div></div>
<section class="view active" id="conversation"><div class="stream"></div></section>
<section class="view" id="raw"><div class="stream"></div></section>
<section class="view" id="validation"><div class="stream"></div></section>
<section class="view" id="broker"><div class="stream"></div></section>
<section class="view" id="authority"><div class="dag"></div></section>
<section class="view" id="prompts"><div class="stream"></div></section>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=document.querySelectorAll('.tab');tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.view).classList.add('active')});
function card(e,cls=''){const accepted=e.accepted===true?' · <span class="ok">accepted</span>':e.accepted===false?' · <span class="bad">refused</span>':'';return `<article class="card ${cls}"><div class="meta"><span class="pill ${esc(e.role)}">${esc(e.role)}</span><span>#${esc(e.sequence)} · turn ${esc(e.turn??'—')}</span>${accepted}<span>${esc(e.detail||'')}</span></div><pre>${esc(typeof e.payload==='string'?e.payload:JSON.stringify(e.payload,null,2))}</pre></article>`}
function conversationCard(e){let payload=e.payload;try{const value=JSON.parse(e.payload);if(e.kind==='input'&&value.kind==='user_text')payload=value.text;if(e.kind==='tool_result'&&value.kind==='tool_result')payload=`${value.result}: ${value.text}`;if(e.kind==='tool_call')payload=`${value.command}(${(value.arguments||[]).join(', ')})`;}catch(_){}return card({...e,payload},e.kind==='assistant_message'?'answer':e.kind.startsWith('tool')?'tool':'')}
function brokerOffers(events){const inputs=events.filter(e=>e.role==='broker'&&e.kind==='input');for(let i=inputs.length-1;i>=0;i--){try{const value=JSON.parse(inputs[i].payload);if(Array.isArray(value.offer_catalog))return value.offer_catalog}catch(_){}}return []}
function currentAuthority(events){const latest=new Map;for(const e of events.filter(e=>e.kind==='authority_state')){const p=e.payload||{};latest.set(`${p.agent_slot}:${p.generation}:${p.kind}:${p.label}`,p)}return latest}
function authorityDag(events){const offers=brokerOffers(events);const latest=currentAuthority(events);if(!offers.length&&!latest.size)return '<div class="empty">No broker catalog or resident-broker commit attestation yet.</div>';const agents=new Map,states=new Map;for(const p of latest.values()){const key=`${p.agent_slot}:${p.generation}`;if(!agents.has(key))agents.set(key,[]);if(p.kind==='agent')states.set(key,p.state);else agents.get(key).push(p)}const offered=offers.length?`<div class="edge"><div class="node"><b>bounded offer catalog</b><div class="meta">selectors only · not installed authority</div></div>${offers.map(p=>`<div class="node"><div class="meta"><span class="pill">offer ${esc(p.index)}</span>${esc(p.kind)}</div><b>${esc(p.label)}</b><pre>permitted ops: ${esc(p.permitted_ops)} · max uses: ${esc(p.max_uses)}</pre></div>`).join('')}</div>`:'';const installed=[...agents].map(([key,caps])=>{const [slot,generation]=key.split(':'),agentState=states.get(key)||'installed';return `<div class="edge"><div class="node agent-node ${agentState==='installed'?'':'revoked'}"><b>agent ${esc(slot)}</b><div class="meta"><span class="pill">${esc(agentState)}</span>generation ${esc(generation)} · actual committed authority</div></div>${caps.map(p=>{const state=agentState==='teardown'?'teardown':p.state;return `<div class="node authority ${state==='installed'?'':'revoked'}"><div class="meta"><span class="pill">${esc(state)}</span>${esc(p.kind)}</div><b>${esc(p.label)}</b><pre>rights: ${esc(p.rights)}</pre></div>`}).join('')}</div>`}).join('');return `<div class="node"><div class="meta"><span class="pill broker">resident broker</span>authority-bearing reference monitor</div>${offered}${installed}</div>`}
function render(events){eventCount.textContent=events.length;agentCount.textContent=new Set(events.filter(e=>e.role==='agent').map(e=>e.route+':'+e.turn)).size;const authority=[...currentAuthority(events).values()],torn=new Set(authority.filter(p=>p.kind==='agent'&&p.state==='teardown').map(p=>`${p.agent_slot}:${p.generation}`));grantCount.textContent=authority.filter(p=>p.state==='installed'&&p.kind!=='agent'&&!torn.has(`${p.agent_slot}:${p.generation}`)).length;refusalCount.textContent=events.filter(e=>e.accepted===false||String(e.detail).includes('refus')).length;
const conversation=events.filter(e=>['input','assistant_message','tool_call','tool_result'].includes(e.kind)&&e.role==='agent');document.querySelector('#conversation .stream').innerHTML=conversation.length?conversation.map(conversationCard).join(''):'<div class="empty">No worker conversation yet.</div>';
const raw=events.filter(e=>['raw_model_completion','returned_model_fields'].includes(e.kind));document.querySelector('#raw .stream').innerHTML=raw.length?raw.map(e=>card(e)).join(''):'<div class="empty">No llama.cpp completion yet.</div>';
const validation=events.filter(e=>e.kind==='validation');document.querySelector('#validation .stream').innerHTML=validation.length?validation.map(e=>card(e,e.accepted?'':'tool')).join(''):'<div class="empty">No validation decision yet.</div>';
const broker=events.filter(e=>e.role==='broker'||e.role==='resident_broker');document.querySelector('#broker .stream').innerHTML=broker.length?broker.map(e=>card(e)).join(''):'<div class="empty">No broker activity yet.</div>';
document.querySelector('#authority .dag').innerHTML=authorityDag(events);
const prompts=events.filter(e=>e.kind==='model_prompt');document.querySelector('#prompts .stream').innerHTML=prompts.length?prompts.map(e=>card(e)).join(''):'<div class="empty">No model prompt yet.</div>'}
async function refresh(){try{const r=await fetch('/api/events',{cache:'no-store'});if(!r.ok)throw Error(r.status);const e=await r.json();render(e);status.textContent='live · '+new Date().toLocaleTimeString()}catch(e){status.textContent='disconnected'}setTimeout(refresh,500)}refresh();
</script>
</body>
</html>
