[package]
name = "vkore-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "An operator agent for one vKore machine, over the OpenAI chat protocol, with every action gated."

[dependencies]
blake3.workspace = true
getrandom = "0.3"
# The ureq native-tls feature requires an explicitly configured connector.
native-tls = "0.2"
serde.workspace = true
serde_json.workspace = true
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
url = "2"
vkore-addon-sdk = { path = "../vkore-addon-sdk" }
vkore-policy = { path = "../vkore-policy" }

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
