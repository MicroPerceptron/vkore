[package]
name = "iced_renderer"
version = "0.15.0-dev"
edition = "2024"
publish = false
license = "MIT"
description = "Type-only Iced widget compatibility for caller-owned renderers."

[features]
default = []
canvas = ["geometry"]
geometry = ["iced_graphics/geometry"]
image = ["iced_graphics/image"]
svg = ["iced_graphics/svg"]
svg-text = ["svg"]
svg-raster-images = ["svg"]
web-colors = ["iced_graphics/web-colors"]
wgpu = []
wgpu-bare = []
tiny-skia = []
x11 = []
wayland = []

[dependencies]
axui-iced = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "f538395bd55b318917125da997239fe82a849886" }
iced_core = { git = "https://github.com/MicroPerceptron/iced", rev = "ef15c381bae13130daf682a124819e26f94c5efe", default-features = false }
iced_graphics = { git = "https://github.com/MicroPerceptron/iced", rev = "ef15c381bae13130daf682a124819e26f94c5efe", default-features = false }
