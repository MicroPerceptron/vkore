name: QEMU runtime
on:
  pull_request:
    paths:
      - 'packaging/**'
      - 'tools/*qemu*'
      - '.github/workflows/qemu-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config libglib2.0-dev libpixman-1-dev libslirp-dev zlib1g-dev libgtk-3-dev patchelf
          python -m pip install meson==1.9.1 setuptools==80.9.0 wheel==0.45.1
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkgconf glib pixman libslirp
          python -m pip install meson==1.9.1 setuptools==80.9.0 wheel==0.45.1
      - name: Test packaging checks
        run: python -m unittest discover -s tools -p 'test_qemu*.py' -v
      - name: Build and verify relocated runtime
        run: python tools/build-qemu-runtime.py --work-dir "$RUNNER_TEMP/qemu-build" --output "$RUNNER_TEMP/qemu-runtime" --jobs 3
      - name: Archive runtime and exact upstream source
        run: |
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/qemu-runtime-${{ runner.os }}-${{ runner.arch }}.tar.gz" qemu-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-runtime-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/qemu-runtime-*.tar.gz
            ${{ runner.temp }}/qemu-build/qemu.tar.xz
          retention-days: 7
