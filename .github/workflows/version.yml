name: Version policy
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Semantic versioning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test version policy
        run: python3 -m unittest discover -s tools/tests -p 'test_versioning.py'
      - name: Validate release version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 tools/check-version.py
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 tools/check-version.py --tag "$GITHUB_REF_NAME"
          elif [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            python3 tools/check-version.py --base "$BASE_SHA"
          fi
