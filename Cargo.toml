[workspace]
members = [
    "crates/vkore-addon-sdk",
    "crates/vkore-reference-addon",
    "crates/vkore-policy",
    "crates/vkore-packages",
    "crates/vkored",
    "crates/vkore-hostlink-ab",
    "crates/vkore-vm",
    "crates/vkore-workspace",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/MicroPerceptron/vkore"
rust-version = "1.97"

# PR #722 is the integration source for the initial extraction. These shared
# crates remain Kore-owned wire/guest contracts; vKore consumes one exact
# revision instead of copying protocol definitions into the host repository.
[workspace.dependencies]
blake3 = { version = "=1.8.6", default-features = false, features = ["pure"] }
kore-block = { git = "https://github.com/MicroPerceptron/kore.git", rev = "cccf76da11fa397242c587817ec975dce529f40e" }
kore-hostlink = { git = "https://github.com/MicroPerceptron/kore.git", rev = "cccf76da11fa397242c587817ec975dce529f40e" }
kore-hostlink-shmem = { git = "https://github.com/MicroPerceptron/kore.git", rev = "cccf76da11fa397242c587817ec975dce529f40e" }
kore-svc-fs = { git = "https://github.com/MicroPerceptron/kore.git", rev = "cccf76da11fa397242c587817ec975dce529f40e" }
kore-workspace-sync = { git = "https://github.com/MicroPerceptron/kore.git", rev = "cccf76da11fa397242c587817ec975dce529f40e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
