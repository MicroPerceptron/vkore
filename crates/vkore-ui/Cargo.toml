[package]
name = "vkore-ui"
version = "0.0.0"
edition = "2024"
publish = false
license = "MPL-2.0"
description = "Native Axiom-rendered desktop control plane for vKore."

[dependencies]
axcomp = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "dca586fa402661669a7fcb71f1d7491e96ee7097" }
axgfx = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "dca586fa402661669a7fcb71f1d7491e96ee7097" }
axrd = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "dca586fa402661669a7fcb71f1d7491e96ee7097" }
axui-core = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "dca586fa402661669a7fcb71f1d7491e96ee7097" }
axui-iced = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "dca586fa402661669a7fcb71f1d7491e96ee7097" }
axui-raster = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "dca586fa402661669a7fcb71f1d7491e96ee7097" }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
iced_core = { git = "https://github.com/MicroPerceptron/iced", rev = "3de451447bd28217bb535632867550908e29d5d0", default-features = false }
iced_runtime = { git = "https://github.com/MicroPerceptron/iced", rev = "3de451447bd28217bb535632867550908e29d5d0", default-features = false }
iced_widget = { git = "https://github.com/MicroPerceptron/iced", rev = "3de451447bd28217bb535632867550908e29d5d0", default-features = false }
iced_winit = { git = "https://github.com/MicroPerceptron/iced", rev = "3de451447bd28217bb535632867550908e29d5d0", default-features = false, features = ["x11", "wayland"] }
serde_json.workspace = true
softbuffer = "0.4.8"

[dev-dependencies]
hostlinkd = { package = "vkored", path = "../vkored" }
tempfile = "3.27"

[[bin]]
name = "vkore-ui"
path = "src/main.rs"
