[package]
name = "vkore-ui"
version = "0.1.0"
edition = "2024"
publish = false
license = "MPL-2.0"
description = "vKore's native desktop: Kore machines and their DagFS volumes, rendered with Iced over Axiom."

[dependencies]
axcomp = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "adbd939acacdf0759c026fafbae5e0cd9dee1fd4" }
axgfx = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "adbd939acacdf0759c026fafbae5e0cd9dee1fd4" }
axui-core = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "adbd939acacdf0759c026fafbae5e0cd9dee1fd4" }
axui-fonts = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "adbd939acacdf0759c026fafbae5e0cd9dee1fd4" }
axui-iced = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "adbd939acacdf0759c026fafbae5e0cd9dee1fd4" }
axui-raster = { git = "https://github.com/MicroPerceptron/axiom.git", rev = "adbd939acacdf0759c026fafbae5e0cd9dee1fd4" }
cosmic-text = "0.19"
# Parses the mark's SVG path data; already reached through the geometry lane.
zeno = "0.3.3"
iced_core = { git = "https://github.com/MicroPerceptron/iced", rev = "1021994b8a155e8285ca5ea18239467616387fbd", default-features = false, features = ["crisp"] }
iced_graphics = { git = "https://github.com/MicroPerceptron/iced", rev = "1021994b8a155e8285ca5ea18239467616387fbd", default-features = false, features = ["geometry"] }
iced_runtime = { git = "https://github.com/MicroPerceptron/iced", rev = "1021994b8a155e8285ca5ea18239467616387fbd", default-features = false }
iced_widget = { git = "https://github.com/MicroPerceptron/iced", rev = "1021994b8a155e8285ca5ea18239467616387fbd", default-features = false, features = ["canvas"] }
iced_winit = { git = "https://github.com/MicroPerceptron/iced", rev = "1021994b8a155e8285ca5ea18239467616387fbd", default-features = false, features = ["x11", "wayland"] }
softbuffer = "0.4.8"
# Character maps of the bundled faces. Already built for fontdb; no new code.
ttf-parser = { version = "0.25.1", default-features = false }
vkored = { path = "../vkored" }
vkore-vm = { path = "../vkore-vm" }
vkore-volume = { path = "../vkore-volume" }

[dev-dependencies]
tempfile = "3.27"

[[bin]]
name = "vkore-ui"
path = "src/main.rs"
