[package]
name = "vkored"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "vKore's runtime: Kore machines and their volumes on a Linux or macOS host, and the `vkore` command."

[dependencies]
serde.workspace = true
serde_json.workspace = true
vkore-vm = { path = "../vkore-vm" }
# Reuse the workspace's TLS client; decode no compressed response bodies.
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
tempfile = "3.23.0"
url = "2"
rustix = { version = "1.1.4", features = ["process", "fs"] }
# Maintained MIT HTTP stack; HTTP/1 only, no websocket, HTTP/2 or macros.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
# MIT terminal screen model; no std feature keeps vte's OSC buffer bounded.
vt100 = { version = "=0.18.1", default-features = false }

[target.'cfg(unix)'.dependencies]
vkore-volume = { path = "../vkore-volume" }
clap = { version = "4.6.7", features = ["derive"] }
# Ctrl-C asks the guest to stop rather than killing QEMU under it.
ctrlc = "3.5.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lib]
name = "vkored"
path = "src/lib.rs"

[[bin]]
name = "vkore"
path = "src/bin/vkore.rs"

[lints]
workspace = true
