[package]
name = "vkore-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Kore machines under QEMU: the production topology, host probes, boot media, QMP and boot readiness."

[lib]
name = "vkore_vm"
path = "src/lib.rs"

[dependencies]
vkore-devices = { path = "../vkore-devices" }
serde.workspace = true
serde_json.workspace = true
# Generated QAPI vocabulary only; keep our bounded, id-correlated transport.
qapi-qmp = "=0.15.0"
qapi-spec = "=0.3.2"
rustix = { version = "1.1.4", features = ["event", "thread", "process", "fs", "param", "mm"] }
# Kore publishes boot media digests as SHA-256 (release SHA256SUMS).
sha2 = "0.10.9"
# MIT; query CPU/memory/disks only, no process inventory or background sampling.
sysinfo = { version = "=0.40.4", default-features = false, features = ["system", "disk"] }

[target.'cfg(target_os = "linux")'.dependencies]
# MIT/Apache-2.0; already locked transitively. rustix lacks MADV_COLLAPSE.
libc = "=0.2.191"
# Reuse the CLI's signal handler so the guardian also cleans up on TERM/HUP.
ctrlc = { version = "3.5.2", features = ["termination"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
# rust-vmm's MIT/Apache-2.0 wrappers; only open KVM and query capabilities.
kvm-ioctls = "=0.25.1"
kvm-bindings = "=0.14.2"
# MIT, already in the lockfile; typed, allocation-free host CPUID queries.
raw-cpuid = "=11.6.0"

[dev-dependencies]
tempfile = "3.23.0"

[lints]
workspace = true
